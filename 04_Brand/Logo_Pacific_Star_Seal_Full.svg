<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="ps-seal-title ps-seal-desc">
  <title id="ps-seal-title">Pacific Star — печать «Меридиан»</title>
  <desc id="ps-seal-desc">Круглая печать с шестилучевой меткой ориентирования в центре, надпись по верхней дуге «ТИХООКЕАНСКАЯ ЗВЕЗДА · ЭКСПЕДИЦИЯ · ПЕРЕВОЗКИ · С 2008». Монохром Stamp Ink #1F2A35.</desc>

  <defs>
    <path id="ps-arc-top" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
    <path id="ps-arc-bottom" d="M 35 100 A 65 65 0 0 0 165 100" fill="none"/>
  </defs>

  <g fill="none" stroke="#1F2A35">
    <circle cx="100" cy="100" r="92" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="82" stroke-width="0.5"/>
  </g>

  <circle cx="14" cy="100" r="1.8" fill="#1F2A35"/>
  <circle cx="186" cy="100" r="1.8" fill="#1F2A35"/>

  <g fill="#1F2A35" font-family="Inter Display, Inter, Arial, sans-serif">
    <text font-size="10" font-weight="700" letter-spacing="3" text-anchor="middle">
      <textPath href="#ps-arc-top" startOffset="50%">ТИХООКЕАНСКАЯ ЗВЕЗДА</textPath>
    </text>
    <text font-size="8" font-weight="600" letter-spacing="2" text-anchor="middle">
      <textPath href="#ps-arc-bottom" startOffset="50%">ЭКСПЕДИЦИЯ · ПЕРЕВОЗКИ · С 2008</textPath>
    </text>
  </g>

  <g transform="translate(100 100)" stroke="#1F2A35" fill="#1F2A35">
    <line x1="-58" y1="0" x2="58" y2="0" stroke-width="2"/>
    <line x1="0" y1="-58" x2="0" y2="58" stroke-width="2"/>
    <line x1="-31" y1="-31" x2="31" y2="31" stroke-width="1.4"/>
    <line x1="-31" y1="31" x2="31" y2="-31" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="4"/>
  </g>
</svg>
